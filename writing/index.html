<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="技术分享目录：按期保存部署笔记、实测报告、图片、测试脚本与原始结果。"
    />
    <title>文字｜技术分享目录</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5f0e6;
        --paper-deep: #ebe2d2;
        --ink: #26382e;
        --muted: #768177;
        --line: rgba(38, 56, 46, 0.14);
        --red: #a9604d;
        --green: #627a68;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(
            circle at 78% 8%,
            rgba(169, 96, 77, 0.1),
            transparent 28rem
          ),
          linear-gradient(145deg, #f8f4eb 0%, var(--paper) 58%, #eee6d7 100%);
        font-family: 'Songti SC', 'Noto Serif SC', 'STSong', Georgia, serif;
      }

      a {
        color: inherit;
      }

      main {
        width: min(1080px, calc(100% - 40px));
        margin: 0 auto;
        padding: 32px 0 56px;
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        letter-spacing: 0.12em;
      }

      nav a {
        text-decoration: none;
      }

      nav span {
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
      }

      header {
        padding: 88px 0 60px;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--red);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.2em;
      }

      h1 {
        margin: 0;
        font-size: clamp(46px, 8vw, 88px);
        font-weight: 400;
        letter-spacing: 0.08em;
        line-height: 1;
      }

      .lead {
        max-width: 520px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.9;
      }

      section + section {
        margin-top: 68px;
      }

      .section-label {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.14em;
      }

      .latest {
        display: block;
        padding: clamp(26px, 5vw, 48px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(255, 252, 245, 0.68);
        box-shadow: 0 24px 70px rgba(57, 47, 34, 0.08);
        text-decoration: none;
        transition:
          transform 220ms ease,
          box-shadow 220ms ease;
      }

      a:focus-visible {
        outline: 2px solid var(--red);
        outline-offset: 6px;
      }

      .latest:hover {
        transform: translateY(-3px);
        box-shadow: 0 30px 80px rgba(57, 47, 34, 0.12);
      }

      .latest time {
        color: var(--red);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
      }

      h2 {
        max-width: 720px;
        margin: 22px 0 36px;
        font-size: clamp(28px, 5vw, 50px);
        font-weight: 400;
        line-height: 1.3;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .metric {
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.08em;
      }

      .metric strong {
        display: block;
        margin-top: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 22px;
        font-weight: 500;
      }

      .card-foot {
        display: flex;
        justify-content: space-between;
        margin-top: 40px;
        color: var(--muted);
        font-size: 11px;
      }

      .card-foot b {
        color: var(--green);
        font-weight: 400;
      }

      ol {
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--line);
      }

      li a {
        display: grid;
        grid-template-columns: 160px 1fr auto;
        gap: 20px;
        align-items: center;
        padding: 22px 4px;
        border-bottom: 1px solid var(--line);
        text-decoration: none;
      }

      li a:hover span {
        color: var(--red);
      }

      li time {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }

      li span {
        transition: color 180ms ease;
      }

      li em {
        color: var(--muted);
        font-size: 10px;
        font-style: normal;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        margin-top: 72px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 10px;
        line-height: 1.8;
      }

      @media (max-width: 700px) {
        main {
          width: min(100% - 28px, 1080px);
          padding-top: 22px;
        }

        header {
          padding: 62px 4px 44px;
        }

        .card-foot {
          flex-wrap: wrap;
          gap: 12px;
        }

        h2 {
          overflow-wrap: anywhere;
        }

        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 24px 14px;
        }

        li a {
          grid-template-columns: 1fr auto;
        }

        li span {
          grid-column: 1 / -1;
          grid-row: 2;
          color: var(--muted);
          font-size: 12px;
        }

        footer {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <nav>
        <a href="/">长嬴漫游</a>
        <span>WRITING ARCHIVE</span>
      </nav>

      <header>
        <p class="eyebrow">TECHNICAL NOTES</p>
        <h1>文字</h1>
        <p class="lead">部署笔记、技术分享与实测记录，按期保存文档和配套资料。</p>
      </header>

      <section aria-labelledby="latest-title">
        <p class="section-label" id="latest-title">最新一期 · 技术分享</p>
        <a class="latest" href="https://github.com/LemuriaX/blog/tree/main/writing/%E6%9C%AC%E5%9C%B0%E9%83%A8%E7%BD%B2qwen3.8-27B">
          <time datetime="2026-09-06">2026.09.06 · 第一期</time>
          <h2>本地部署qwen3.8-27B</h2>
          <div class="metrics">
            <div class="metric"><span>目标显存</span><strong>20 GB</strong></div>
            <div class="metric"><span>模型规模</span><strong>27B</strong></div>
            <div class="metric"><span>量化版本</span><strong>3 种</strong></div>
            <div class="metric"><span>测试类别</span><strong>3 类</strong></div>
          </div>
          <div class="card-foot">
            <span>文档 · 图片 · 脚本 · 原始结果</span>
            <b>打开本期资料 →</b>
          </div>
        </a>
      </section>

      <section aria-labelledby="archive-title">
        <p class="section-label" id="archive-title">全部期次</p>
        <ol>
          <li>
            <a href="https://github.com/LemuriaX/blog/tree/main/writing/%E6%9C%AC%E5%9C%B0%E9%83%A8%E7%BD%B2qwen3.8-27B">
              <time datetime="2026-09-06">2026.09.06</time>
              <span>本地部署qwen3.8-27B</span>
              <em>第一期</em>
            </a>
          </li>
        </ol>
      </section>

      <footer>
        <span>文档与原始资料保存在 GitHub。</span>
        <a href="https://github.com/LemuriaX/blog/tree/main/writing">查看全部资料</a>
      </footer>
    </main>
  </body>
</html>
