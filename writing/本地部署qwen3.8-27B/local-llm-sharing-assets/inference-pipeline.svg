<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">一次推理的三个性能阶段</title>
  <desc id="desc">模型加载、Prompt Prefill 和 Token Decode 阶段及其对应指标</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafafa"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
    <filter id="s4" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg4)"/>
  <text x="70" y="82" fill="#0f172a" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="40" font-weight="700">模型加载、输入处理与生成输出</text>
  <text x="72" y="122" fill="#64748b" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="21">长输入增加输入处理和历史缓存读取量；Thinking 通常增加输出 Token</text>

  <g filter="url(#s4)" font-family="Microsoft YaHei, Segoe UI, sans-serif">
    <rect x="85" y="205" width="310" height="330" rx="28" fill="#1e3a8a"/>
    <circle cx="155" cy="275" r="35" fill="#60a5fa"/><text x="155" y="286" text-anchor="middle" fill="#172554" font-size="30" font-weight="700">1</text>
    <text x="205" y="270" fill="#dbeafe" font-size="22">LOAD</text><text x="205" y="305" fill="#fff" font-size="31" font-weight="700">模型加载</text>
    <text x="125" y="375" fill="#dbeafe" font-size="21">• 读取权重</text><text x="125" y="414" fill="#dbeafe" font-size="21">• 权重放入显存</text><text x="125" y="453" fill="#dbeafe" font-size="21">• 分配缓存和缓冲</text>
    <text x="125" y="500" fill="#93c5fd" font-size="18">独立记录启动到模型可用</text>

    <rect x="485" y="205" width="310" height="330" rx="28" fill="#0f766e"/>
    <circle cx="555" cy="275" r="35" fill="#5eead4"/><text x="555" y="286" text-anchor="middle" fill="#134e4a" font-size="30" font-weight="700">2</text>
    <text x="605" y="270" fill="#ccfbf1" font-size="22">PREFILL</text><text x="605" y="305" fill="#fff" font-size="31" font-weight="700">处理输入</text>
    <text x="525" y="375" fill="#ccfbf1" font-size="21">• 读取 Prompt</text><text x="525" y="414" fill="#ccfbf1" font-size="21">• 保存计算中间结果</text><text x="525" y="453" fill="#ccfbf1" font-size="21">• 影响首个输出等待</text>
    <text x="525" y="500" fill="#99f6e4" font-size="19">指标：TTFT、Prompt tok/s</text>

    <rect x="885" y="205" width="310" height="330" rx="28" fill="#9d174d"/>
    <circle cx="955" cy="275" r="35" fill="#f9a8d4"/><text x="955" y="286" text-anchor="middle" fill="#831843" font-size="30" font-weight="700">3</text>
    <text x="1005" y="270" fill="#fce7f3" font-size="22">DECODE</text><text x="1005" y="305" fill="#fff" font-size="31" font-weight="700">生成输出</text>
    <text x="925" y="375" fill="#fce7f3" font-size="21">• 逐步生成 Token</text><text x="925" y="414" fill="#fce7f3" font-size="21">• 读取权重和历史缓存</text><text x="925" y="453" fill="#fce7f3" font-size="21">• 推理内容也占 Token</text>
    <text x="925" y="500" fill="#fbcfe8" font-size="18">生成速度、TTFA、总耗时</text>
  </g>

  <path d="M410 370h55" stroke="#64748b" stroke-width="6"/><path d="M455 356l20 14-20 14" fill="#64748b"/>
  <path d="M810 370h55" stroke="#64748b" stroke-width="6"/><path d="M855 356l20 14-20 14" fill="#64748b"/>
  <rect x="190" y="600" width="900" height="58" rx="29" fill="#e2e8f0"/>
  <text x="640" y="637" text-anchor="middle" fill="#334155" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="21" font-weight="700">模型加载单独计时；请求耗时还包含调度和传输开销</text>
</svg>
