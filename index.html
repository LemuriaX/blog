<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长嬴漫游</title>
    <style>
        :root {
            --bg-color: #fcfcf9;
            --text-color: #2c2c2c;
            --sub-color: #8c8c8c;
            --accent-color: #7a9e9f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Songti SC", "Noto Serif SC", "STSong", "Times New Roman", serif;
            line-height: 2;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 80%;
            text-align: center;
            animation: slowFadeIn 2s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 500;
            letter-spacing: 0.5rem;
            margin-bottom: 3rem;
            color: #000;
        }

        .divider {
            width: 40px;
            height: 1px;
            background-color: var(--sub-color);
            margin: 0 auto 3rem auto;
            opacity: 0.5;
        }

        .intro p {
            font-size: 1rem;
            color: var(--text-color);
            margin-bottom: 1.5rem;
        }

        .intro span {
            display: block;
            font-size: 0.85rem;
            color: var(--sub-color);
            font-style: italic;
            margin-top: 10px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .links {
            margin-top: 4rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.6rem 2rem;
            font-size: 0.9rem;
        }

        .links a {
            text-decoration: none;
            color: var(--sub-color);
            transition: all 0.5s ease;
        }

        .links a:hover { color: var(--accent-color); }

        @keyframes slowFadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; letter-spacing: 0.2rem; }
            .container { width: 90%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>长嬴漫游</h1>
    <div class="divider"></div>
    <div class="intro">
        <p>人是会思考的芦苇</p>
        <span>Roaming in the endless summer.</span>
    </div>
    <div class="links">
        <a href="/market/" title="市场手记">市场手记</a>
        <a href="/writing/" title="阅读我的文字">文字</a>
        <a href="#" title="查看我的摄影">影像</a>
        <a href="/travel/" title="查看旅行攻略">旅行攻略</a>
    </div>
</div>

</body>
</html>
